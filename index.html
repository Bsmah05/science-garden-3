<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مغامرة الغابة | العلوم</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#e6f5dd;color:#173f2b;text-align:center}.top{display:flex;justify-content:space-between;gap:12px;padding:13px 18px;background:#174c35;color:white;font-weight:bold;flex-wrap:wrap}.hero{position:relative;max-width:1100px;margin:12px auto;border-radius:22px;overflow:hidden;box-shadow:0 12px 28px #16452b33}.hero img{display:block;width:100%}.overlay{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);background:#fffbe9ef;border:3px solid #b38a47;border-radius:22px;padding:14px;width:min(88%,430px)}h1{font-size:clamp(24px,5vw,42px);margin:6px}h2{margin:8px}input{padding:14px;width:95%;font-size:19px;border-radius:12px;border:2px solid #98bc9b;text-align:center}button{background:#147d3d;color:white;border:0;border-radius:14px;padding:13px 24px;font-size:19px;font-weight:bold;cursor:pointer;margin:9px}button:disabled{opacity:.5}.panel{max-width:780px;margin:20px auto;padding:22px;background:#fffdf0;border:3px solid #b8d3a6;border-radius:24px;box-shadow:0 6px 18px #205c3030}.hidden{display:none}.path{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:12px}.step{padding:9px;border-radius:12px;background:#c6dec3;font-size:13px}.step.active{background:#ffc65a}.choices{display:grid;gap:10px;margin:18px auto;max-width:550px}.choices button{background:#f4f8e9;color:#174a32;border:2px solid #7ba985;margin:0;text-align:right}.choices button:hover{background:#d9f0cf}.feedback{font-size:19px;min-height:30px;font-weight:bold}.scene{font-size:60px;margin:12px}.small{font-size:14px}.score{font-size:22px;color:#98650b;font-weight:bold}@media(max-width:650px){.hero img{height:360px;object-fit:cover;object-position:center}.overlay{position:relative;bottom:auto;left:auto;transform:none;width:100%;border-radius:0}.hero{margin:0;border-radius:0}.top{font-size:13px}.panel{margin:12px;padding:14px}}</style></head><body><header class="top"><span>🏫 مدرسة سلمة بن ثابت<br>👨‍🏫 المعلم: خالد الصبحي</span><span>🌿 العلوم | الصف الثالث الابتدائي</span></header><section id="start" class="hero"><img src="jungle.png" alt="مغامرة الغابة وشخصية المستكشف"><div class="overlay"><h1>🌳 مغامرة الغابة</h1><p>اكتب اسمك يا بطل، ثم انطلق لإنقاذ البيئة!</p><input id="name" maxlength="35" placeholder="اكتب اسمك هنا" aria-label="اسم الطالب"><br><button onclick="begin()">🚀 ابدأ المغامرة</button><div id="nameErr" class="feedback" role="alert"></div></div></section><main id="game" class="panel hidden"><div class="path" id="path"></div><div class="score" id="score"></div><div class="scene" id="scene"></div><h2 id="stage"></h2><p id="greeting"></p><h2 id="question"></h2><div class="choices" id="choices"></div><div class="feedback" id="feedback" aria-live="polite"></div><button id="next" class="hidden" onclick="advance()">إلى السؤال التالي ←</button></main><section id="finish" class="panel hidden"><div class="scene">🏆🌳⭐</div><h1>مبروك يا بطل الغابة!</h1><h2 id="winner"></h2><p>أنهيت مغامرة الغابة وأصبحت من أبطال حماية البيئة!</p><p class="score" id="finalscore"></p><button onclick="window.print()">🖨️ طباعة النتيجة</button><button onclick="location.reload()">🔄 العب مرة أخرى</button></section><script>const stages=[{title:'المرحلة الأولى: بوابة الغابة',icon:'🌳🦋',qs:[['ما الذي قد يغيّر البيئة؟',['الفيضانات والجفاف','قراءة القصص','ترتيب الكتب'],0],['ماذا يحدث عندما تتغير البيئة؟',['لا يتأثر أي مخلوق','قد تتأثر المخلوقات الحية','تختفي جميع الأشجار فورًا'],1]]},{title:'المرحلة الثانية: عبور النهر',icon:'🌧️🌊',qs:[['ما الفيضان؟',['ارتفاع الماء وغمر اليابسة','نقص الأمطار لفترة طويلة','هبوب نسيم خفيف'],0],['كيف قد يؤثر الفيضان في الحيوانات؟',['يُغرق مساكن بعضها','يجعل كل الحيوانات تطير','لا يؤثر في مساكنها'],0]]},{title:'المرحلة الثالثة: أرض الجفاف',icon:'☀️🌵',qs:[['ما الجفاف؟',['هطول أمطار غزيرة','قلة الأمطار مدة طويلة','فيضان النهر'],1],['كيف يؤثر الجفاف في النباتات؟',['قد تذبل وتموت بسبب نقص الماء','تنمو جميعها بسرعة','تتحول إلى صخور'],0]]},{title:'المرحلة الرابعة: إنقاذ الحيوانات',icon:'🐘🦌',qs:[['كيف قد تستجيب الحيوانات لتغير البيئة؟',['تنتقل إلى مكان مناسب','تتوقف جميعها عن الحركة','تصبح كلها نباتات'],0],['عندما يقل الغذاء في موطن حيوان، فقد...',['يبحث عن غذاء في مكان آخر','لا يحتاج إلى الغذاء','يتحول إلى ماء'],0]]},{title:'المرحلة الخامسة: حماية المخلوقات الحية',icon:'🦁🐢',qs:[['متى يصبح المخلوق الحي مهددًا بالانقراض؟',['عندما يقل عدد أفراده كثيرًا','عندما يكثر عدده','عندما يتوفر له الغذاء'],0],['كيف نساعد في حماية الحيوانات المهددة بالانقراض؟',['بحماية مواطنها الطبيعية','بتدمير مواطنها','بقطع جميع الأشجار'],0]]}];let student='',s=0,q=0,stars=0,locked=false;const el=id=>document.getElementById(id);function begin(){student=el('name').value.trim();if(!student){el('nameErr').textContent='اكتب اسمك أولًا يا بطل 🌟';return}el('start').classList.add('hidden');el('game').classList.remove('hidden');render()}function render(){locked=false;let st=stages[s],item=st.qs[q];el('path').innerHTML=stages.map((v,i)=>`<span class="step ${i===s?'active':''}">${i<s?'✅':i===s?'📍':'🔒'} ${i+1}</span>`).join('');el('score').textContent=`⭐ النجوم: ${stars} من 10`;el('scene').textContent=st.icon;el('stage').textContent=st.title;el('greeting').textContent=`يا ${student}، أجب عن السؤال لتكمل المغامرة! (${q+1} من ${st.qs.length})`;el('question').textContent=item[0];el('feedback').textContent='';el('next').classList.add('hidden');el('choices').innerHTML='';item[1].forEach((choice,i)=>{let b=document.createElement('button');b.textContent=choice;b.onclick=()=>answer(i,b);el('choices').appendChild(b)})}function answer(i,b){if(locked)return;let correct=stages[s].qs[q][2];if(i===correct){locked=true;stars++;el('feedback').textContent='🌟 أحسنت! إجابة صحيحة، حصلت على نجمة!';b.style.background='#b8efad';[...el('choices').children].forEach(x=>x.disabled=true);el('next').classList.remove('hidden');el('next').textContent=(s===4&&q===1)?'🏆 عرض النتيجة':'تابع المغامرة ←';el('score').textContent=`⭐ النجوم: ${stars} من 10`;try{let a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=740;g.gain.value=.06;o.start();o.stop(a.currentTime+.13)}catch(e){}}else{el('feedback').textContent='🌱 حاول مرة أخرى يا بطل!';b.style.background='#ffdbd2';setTimeout(()=>{b.style.background=''},650)}}function advance(){q++;if(q>=stages[s].qs.length){s++;q=0}if(s>=stages.length){el('game').classList.add('hidden');el('finish').classList.remove('hidden');el('winner').textContent=student;el('finalscore').textContent=`جمعت ${stars} من 10 نجوم ⭐`;return}render()}</script></body></html>
