<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حديقة العلوم 🌷</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(#c9efff,#efffe6);color:#24513c;min-height:100vh;text-align:center}.wrap{max-width:760px;margin:auto;padding:25px 16px}h1{font-size:clamp(28px,6vw,48px);margin:12px}h2{font-size:25px}.card{background:#ffffffeb;border:3px solid #b3e6bc;border-radius:25px;padding:24px;box-shadow:0 9px 24px #4e9c6333;margin:20px 0}.garden{font-size:clamp(25px,6vw,45px);min-height:95px;line-height:1.9;background:#9ddf91;border-radius:25px;padding:12px;transition:.3s}.options{display:grid;gap:12px;margin-top:22px}button{font:inherit;font-size:19px;border:0;border-radius:16px;padding:15px;cursor:pointer;background:#e2f7e5;color:#24513c;font-weight:bold}button:hover{filter:brightness(.96)}button:disabled{cursor:default;opacity:.8}.primary{background:#ffce64;color:#644419;padding:16px 34px}.correct{background:#9de7b1!important}.wrong{background:#ffc0bc!important}.feedback{min-height:45px;font-size:21px;font-weight:bold;margin-top:15px}.small{font-size:16px;color:#557461}.progress{height:14px;border-radius:30px;background:#dce9dc;overflow:hidden}.bar{height:100%;background:#70c98a;width:0;transition:.4s}.hide{display:none}footer{font-size:14px;color:#557461;margin-top:24px}</style></head><body><main class="wrap"><h1>🌷 حديقة العلوم 🌷</h1><p>الصف الثالث الابتدائي | التغيرات تؤثر في المخلوقات الحية</p><div class="garden" id="garden">🌱 🌿 🌱</div><section class="card" id="intro"><h2>أهلًا بكِ يا عالمة العلوم الصغيرة! 🦋</h2><p>أجيبي عن الأسئلة لتزهر حديقتكِ الجميلة. كل إجابة صحيحة تضيف زهرة جديدة!</p><button class="primary" onclick="start()">ابدئي المغامرة ✨</button></section><section class="card hide" id="quiz"><div class="small" id="counter"></div><div class="progress"><div class="bar" id="bar"></div></div><h2 id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="primary hide" id="next" onclick="advance()">السؤال التالي ←</button></section><section class="card hide" id="end"><h2 id="result"></h2><p id="score"></p><button class="primary" onclick="start()">العبِي مرة أخرى 🌼</button></section><footer>تعلمي والعبِي وازرعي المعرفة 🌸</footer></main><script>const questions=[{q:'ما المقصود بالجفاف؟',a:['هطول أمطار غزيرة','انقطاع المطر مدة طويلة','ارتفاع مياه الأنهار'],c:1,e:'الجفاف يحدث عندما تقل الأمطار مدة طويلة.'},{q:'ماذا قد يحدث للنباتات عند الجفاف؟',a:['تذبل بسبب نقص الماء','تنمو أسرع دائمًا','تتحول إلى حيوانات'],c:0,e:'تحتاج النباتات إلى الماء لتعيش وتنمو.'},{q:'ما الفيضان؟',a:['قلة الأمطار','زيادة المياه وغمرها اليابسة','هبوب رياح خفيفة'],c:1,e:'الفيضان هو غمر المياه للأرض.'},{q:'كيف يمكن أن يؤثر الفيضان في مساكن الحيوانات؟',a:['قد يدمر بعضها','يجعلها كلها أقوى','لا يؤثر فيها أبدًا'],c:0,e:'قد تُغمر مساكن الحيوانات بالمياه.'},{q:'ماذا تفعل بعض الحيوانات عندما تتغير بيئتها؟',a:['تنتقل إلى مكان آخر','تتوقف عن الحاجة للماء','تختفي فورًا'],c:0,e:'قد تهاجر بعض الحيوانات بحثًا عن بيئة مناسبة.'},{q:'ماذا قد يحدث لمخلوق حي لا يستطيع التكيف أو الانتقال؟',a:['قد يموت','يصبح نباتًا','لا يتأثر أبدًا'],c:0,e:'قد لا يستطيع البقاء إذا لم تتوافر احتياجاته.'},{q:'أي مما يلي تغير سريع في البيئة؟',a:['حدوث فيضان','نمو شجرة عبر سنوات','تكون التربة ببطء'],c:0,e:'قد يحدث الفيضان خلال وقت قصير.'},{q:'متى يكون المخلوق الحي مهددًا بالانقراض؟',a:['عندما يصبح عدد أفراده قليلًا جدًا','عندما يكثر عدده','عندما يجد غذاءً كافيًا'],c:0,e:'قلة أعداد النوع قد تعرضه لخطر الانقراض.'},{q:'أي عمل يساعد في حماية المخلوقات الحية؟',a:['المحافظة على مواطنها','قطع الأشجار دون حاجة','تلويث المياه'],c:0,e:'حماية المواطن الطبيعية تساعد الكائنات على البقاء.'},{q:'ما سبب قد يؤدي إلى انقراض بعض المخلوقات الحية؟',a:['فقدان موطنها الطبيعي','حماية الغابات','توفير الماء لها'],c:0,e:'فقدان الموطن قد يهدد بقاء النوع.'}];let i=0,points=0,answered=false;const $=id=>document.getElementById(id);function show(id){['intro','quiz','end'].forEach(x=>$(x).classList.toggle('hide',x!==id))}function start(){i=0;points=0;$('garden').textContent='🌱 🌿 🌱';show('quiz');render()}function render(){answered=false;let x=questions[i];$('counter').textContent=`السؤال ${i+1} من ${questions.length} | النجوم ⭐ ${points}`;$('bar').style.width=(i/questions.length*100)+'%';$('question').textContent=x.q;$('feedback').textContent='';$('next').classList.add('hide');$('next').textContent=i===questions.length-1?'شاهدي النتيجة 🎉':'السؤال التالي ←';$('options').innerHTML='';x.a.forEach((t,j)=>{let b=document.createElement('button');b.textContent=t;b.onclick=()=>answer(j,b);$('options').appendChild(b)})}function answer(j,b){if(answered)return;answered=true;let x=questions[i],buttons=[...$('options').children];buttons.forEach(y=>y.disabled=true);buttons[x.c].classList.add('correct');if(j===x.c){points++;$('garden').textContent+=' 🌷';$('feedback').textContent='أحسنتِ! إجابة صحيحة 🌟 '+x.e;try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=660;g.gain.value=.05;o.start();o.stop(a.currentTime+.12)}catch(e){}}else{b.classList.add('wrong');$('feedback').textContent='محاولة جميلة 💗 '+x.e}$('next').classList.remove('hide')}function advance(){i++;if(i<questions.length)render();else{$('bar').style.width='100%';show('end');$('result').textContent=points>=8?'أحسنتِ يا عالمة العلوم الصغيرة! 🏆':'رائعة يا عالمة العلوم! 🌼';$('score').textContent=`حصلتِ على ${points} من ${questions.length} نجوم ⭐`;$('garden').textContent+=' 🦋 🌻 🌈'}}</script></body></html>
